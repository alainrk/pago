basePath: /web
definitions:
  web.BudgetResponse:
    properties:
      amount:
        type: number
      currency:
        type: string
      hasBudget:
        type: boolean
      month:
        type: string
      pct:
        type: integer
      spent:
        type: number
    type: object
  web.BudgetUpsertRequest:
    properties:
      amount:
        type: number
    type: object
  web.CategoriesResponse:
    properties:
      categories:
        items:
          type: string
        type: array
    type: object
  web.CategoryBreakdown:
    properties:
      Expense:
        items:
          $ref: '#/definitions/web.CategoryEntry'
        type: array
      Income:
        items:
          $ref: '#/definitions/web.CategoryEntry'
        type: array
    type: object
  web.CategoryEntry:
    properties:
      amount:
        type: number
      category:
        type: string
      count:
        type: integer
      pct:
        type: number
    type: object
  web.CloneTransactionRequest:
    properties:
      id:
        example: 42
        type: integer
    type: object
  web.CreateTransactionRequest:
    properties:
      amount:
        example: 12.5
        type: number
      category:
        example: Food
        type: string
      date:
        example: "2026-05-21"
        type: string
      description:
        example: lunch
        type: string
      type:
        example: Expense
        type: string
    type: object
  web.DeleteTransactionRequest:
    properties:
      id:
        type: integer
    type: object
  web.DuplicateCheckRequest:
    properties:
      amount:
        example: 12.5
        type: number
      date:
        example: "2026-09-03"
        type: string
      description:
        example: Irish pub with Laura
        type: string
    type: object
  web.DuplicateCheckResponse:
    properties:
      duplicates:
        items:
          $ref: '#/definitions/web.TransactionDTO'
        type: array
    type: object
  web.EditTransactionRequest:
    properties:
      amount:
        example: 19.9
        type: number
      category:
        example: Grocery
        type: string
      date:
        example: "2026-05-21"
        type: string
      description:
        example: weekly shop
        type: string
      id:
        example: 42
        type: integer
    type: object
  web.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  web.MeResponse:
    properties:
      currency:
        type: string
      email:
        type: string
      hasEmail:
        description: HasEmail tells the client whether passkey registration is possible.
        type: boolean
      initials:
        description: Initials is a short label for avatars, for example "AR".
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  web.MessageResponse:
    properties:
      message:
        type: string
    type: object
  web.MonthPoint:
    properties:
      balance:
        type: number
      expense:
        type: number
      income:
        type: number
      month:
        type: string
    type: object
  web.MonthlyAnalyticsResponse:
    properties:
      balance:
        type: number
      byCategory:
        $ref: '#/definitions/web.CategoryBreakdown'
      month:
        type: string
      totalExpenses:
        type: number
      totalIncome:
        type: number
    type: object
  web.ParseTransactionRequest:
    properties:
      text:
        example: irish pub with laura 12.50 yesterday
        type: string
    type: object
  web.ParseTransactionResponse:
    properties:
      amount:
        example: 12.5
        type: number
      category:
        example: EatingOut
        type: string
      date:
        example: "2026-09-03"
        type: string
      description:
        example: Irish pub with Laura
        type: string
      duplicates:
        items:
          $ref: '#/definitions/web.TransactionDTO'
        type: array
      type:
        example: Expense
        type: string
    type: object
  web.SearchTransactionsRequest:
    properties:
      amountMax:
        example: 100
        type: number
      amountMin:
        example: 5
        type: number
      category:
        example: Grocery
        type: string
      dateFrom:
        example: "2026-01-01"
        type: string
      dateTo:
        example: "2026-05-31"
        type: string
      limit:
        example: 50
        type: integer
      offset:
        example: 0
        type: integer
      query:
        example: coffee
        type: string
      type:
        example: Expense
        type: string
    type: object
  web.SearchTransactionsResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/web.TransactionDTO'
        type: array
    type: object
  web.StatsResponse:
    properties:
      balance:
        type: number
      totalExpenses:
        type: number
      totalIncome:
        type: number
      totalTransactions:
        type: integer
    type: object
  web.TransactionDTO:
    properties:
      amount:
        type: number
      category:
        type: string
      date:
        type: string
      description:
        type: string
      id:
        type: integer
      type:
        type: string
    type: object
  web.TransactionsResponse:
    properties:
      count:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/web.TransactionDTO'
        type: array
    type: object
  web.TrendResponse:
    properties:
      from:
        type: string
      points:
        items:
          $ref: '#/definitions/web.MonthPoint'
        type: array
      to:
        type: string
    type: object
  web.YearAnalyticsResponse:
    properties:
      balance:
        type: number
      byCategory:
        $ref: '#/definitions/web.CategoryBreakdown'
      byMonth:
        items:
          $ref: '#/definitions/web.YearMonthEntry'
        type: array
      totalExpenses:
        type: number
      totalIncome:
        type: number
      year:
        type: integer
    type: object
  web.YearMonthEntry:
    properties:
      balance:
        type: number
      expense:
        type: number
      income:
        type: number
      month:
        type: integer
    type: object
info:
  contact: {}
  description: 'Personal finance tracking API. All /api/* endpoints require either
    a session cookie (browser) or an Authorization: Bearer <token> header (machine
    clients).'
  title: Pago API
  version: "1.0"
paths:
  /api/analytics/monthly:
    get:
      description: Returns total income/expenses and per-category aggregates for a
        given month.
      parameters:
      - description: Month in YYYY-MM (defaults to current month)
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.MonthlyAnalyticsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Monthly category breakdown
      tags:
      - analytics
  /api/analytics/trend:
    get:
      parameters:
      - description: Number of trailing months (1..60, default 12)
        in: query
        name: months
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.TrendResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Monthly trend over the trailing N months
      tags:
      - analytics
  /api/analytics/year:
    get:
      parameters:
      - description: 4-digit year (defaults to current year)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.YearAnalyticsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Annual breakdown by month and category
      tags:
      - analytics
  /api/budget:
