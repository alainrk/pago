  /api/transactions:
    get:
      parameters:
      - description: Month in YYYY-MM (defaults to current month)
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.TransactionsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List transactions for a month
      tags:
      - transactions
  /api/transactions/clone:
    post:
      consumes:
      - application/json
      description: Duplicate an existing transaction; the new transaction copies type,
        category, amount, description and currency, with date set to today.
      parameters:
      - description: ID of the transaction to clone
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.CloneTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.TransactionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Clone transaction
      tags:
      - transactions
  /api/transactions/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Transaction payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create transaction
      tags:
      - transactions
  /api/transactions/delete:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Transaction ID payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.DeleteTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete transaction
      tags:
      - transactions
  /api/transactions/duplicates:
    post:
      consumes:
      - application/json
      description: Returns recent transactions (last 60 days before the given date)
        with the same amount and a matching description.
      parameters:
      - description: Candidate transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.DuplicateCheckRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.DuplicateCheckResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Find possible duplicates
      tags:
      - transactions
  /api/transactions/edit:
    patch:
      consumes:
      - application/json
      description: Update one or more fields of an existing transaction. Type cannot
        be changed; category must remain within the same type (Income↔Expense swaps
        are rejected).
      parameters:
      - description: Fields to update; only non-null fields are applied
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.EditTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.TransactionDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Edit transaction (partial)
      tags:
      - transactions
  /api/transactions/export:
    get:
      description: 'Stream a CSV containing all transactions matching the optional
        filter set. Columns: date,type,category,amount,currency,description,created_at,updated_at.'
      parameters:
      - description: Substring match on description (case-insensitive)
        in: query
        name: query
        type: string
      - description: Category filter (\
        in: query
        name: category
        type: string
      - description: 'Transaction type: Income or Expense'
        in: query
        name: type
        type: string
      - description: Inclusive lower bound (YYYY-MM-DD)
        in: query
        name: dateFrom
        type: string
      - description: Inclusive upper bound (YYYY-MM-DD)
        in: query
        name: dateTo
        type: string
      - description: Inclusive lower bound on amount
        in: query
        name: amountMin
        type: number
      - description: Inclusive upper bound on amount
        in: query
        name: amountMax
        type: number
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Export transactions as CSV
      tags:
      - transactions
  /api/transactions/parse:
    post:
      consumes:
      - application/json
      description: Uses the configured LLM to extract type, amount, category, description
        and date from a short sentence. Nothing is saved. Also returns recent transactions
        that look like duplicates.
      parameters:
      - description: Free text
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.ParseTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.ParseTransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Parse free text into a transaction (AI)
      tags:
      - transactions
  /api/transactions/search:
    post:
      consumes:
      - application/json
      description: Search a user's transactions by any combination of text, category,
        type, date range, amount range. Returns paginated results with a total count.
      parameters:
      - description: Filter set
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/web.SearchTransactionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.SearchTransactionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/web.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search transactions
      tags:
      - transactions
  /logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.MessageResponse'
      summary: Sign out
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    description: 'Provide the value as: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
